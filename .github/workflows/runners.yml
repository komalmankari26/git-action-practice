name: GitHub Hosted Runners

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Show Ubuntu runner details
        run: |
          echo "OS: Ubuntu"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"

  windows:
    runs-on: windows-latest
    steps:
      - name: Show Windows runner details
        shell: bash
        run: |
          echo "OS: Windows"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"

  macos:
    runs-on: macos-latest
    steps:
      - name: Show macOS runner details
        run: |
          echo "OS: macOS"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"

  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Show installed tools
        run: |
          echo "Docker version:"
          docker --version

          echo "Python version:"
          python --version

          echo "Node version:"
          node --version

          echo "Git version:"
          git --version