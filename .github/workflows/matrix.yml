name: Matrix Build

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
            

    strategy:
      matrix:
        os:
            - ubuntu-latest
            - windows-latest
            - macos-latest
        python-version: [3.8, 3.9, 3.10]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: python --version