name: Conditionals

on:
  push:
    branches:
      - "**"

jobs:
  condition-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Main branch only
        if: github.ref == 'refs/heads/main'
        run: echo "This step runs only on main"

      - name: Intentional failure
        id: failing-step
        continue-on-error: true
        run: |
          echo "This step will fail"
          exit 1

      - name: Runs when previous step fails
        if: steps.failing-step.outcome == 'failure'
        run: echo "The previous step failed, so this step runs"

  push-only-job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Push event
        run: echo "This job runs only for push events"