name: Job Outputs
on:
  push:
    branches:
      - day-43
jobs:
  generate-date:
    runs-on: ubuntu-latest
    outputs:
      current-date: ${{ steps.get-date.outputs.current-date }}
    steps:
      - name: Get Today's Date
        id: get-date
        run: echo "current-date=$(date)" >> $GITHUB_OUTPUT
  show-date:
    runs-on: ubuntu-latest
    needs: generate-date
    steps:
      - name: Show Today's Date
        run: echo "Today's date is ${{ needs.generate-date.outputs.current-date }}"