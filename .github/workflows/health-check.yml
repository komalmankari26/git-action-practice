name: Container Health Check

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest Docker image
        run: docker pull komalmankari26/github-actions-capstone:latest

      - name: Start container
        run: |
          docker run -d \
            --name github-actions-capstone-health \
            -p 5000:5000 \
            komalmankari26/github-actions-capstone:latest

      - name: Wait for application
        run: sleep 5

      - name: Check application health
        run: |
          curl --fail http://localhost:5000/health
          echo "Health check passed."

      - name: Stop and remove container
        if: always()
        run: |
          docker stop github-actions-capstone-health || true
          docker rm github-actions-capstone-health || true

      - name: Add health check summary
        if: always()
        run: |
          echo "## Container Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`komalmankari26/github-actions-capstone:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: \`/health\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container cleanup: completed" >> "$GITHUB_STEP_SUMMARY"