name: Hello GitHub Actions

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 0 * * *'

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show scheduled run
        run: echo "This workflow can also run on a schedule."